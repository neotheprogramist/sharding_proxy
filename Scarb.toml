[package]
name = "sharding_tests"
version = "0.1.0"
edition = "2024_07"

# See more keys and their definitions at https://docs.swmansion.com/scarb/docs/reference/manifest.html

[dependencies]
starknet = "2.13"
openzeppelin_access = "3.0.0"
snforge_std = "0.51.0"
# storage_commitment = { path = "../../katana-tee" }
storage_commitment = { git = "https://github.com/feltroidprime/katana-tee.git", branch = "feature/sharding" }
# dojo = { path = "../../dojo/crates/dojo/core" }
dojo = { git = "https://github.com/michalpalkowski/dojo", branch = "feature/sharding"}
# dojo_snf_test = { path = "../../dojo/crates/dojo/dojo-snf-test" }
dojo_snf_test = { git = "https://github.com/michalpalkowski/dojo", branch = "feature/sharding"}

[dev-dependencies]
snforge_std = "0.51.0"
assert_macros = "2.13"

[lib]
sierra = true
casm = true

[[target.starknet-contract]]
sierra = true
build-external-contracts = ["dojo::world::world_contract::world"]

[scripts]
test = "snforge test"

[tool.scarb]
allow-prebuilt-plugins = ["snforge_std"]

[features]
test_contract = []
dev = []
